services:
  web:
    build: .
    container_name: company-server-web

    ports:
      - "8080:5000"

    environment:
      APP_NAME: Company Server
      APP_ENVIRONMENT: Development
      APP_VERSION: 1.0.0
      DEPLOYMENT_PLATFORM: Docker Compose

    restart: unless-stopped
    
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request

          response = urllib.request.urlopen(
              "http://localhost:5000/health",
              timeout=3,
          )

          assert response.status == 200
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s