name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # Validate repository documentation
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Markdown Files
        run: find . -name "*.md"

  # Validate the Flask application across multiple Python versions
  python-check:
    name: Python Validation
    
    # Execute the same job using multiple Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: 
          - "3.10"
          - "3.11"
          - "3.12"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Display information about the GitHub-hosted runner
      - name: Runner Information
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"

      - name: System Information
        run: |
          uname -a
          docker --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: projects/company-server/web-app/requirements.txt

      - name: Verify Python Version
        run: |
          echo "Testing Python ${{ matrix.python-version }}"
          python --version

      - name: Display Environment Variables
        run: |
          echo "Configured Python Version: ${{ matrix.python-version }}"
          echo "Runner OS: $RUNNER_OS"
          echo "Repository: $GITHUB_REPOSITORY"

      - name: Install Dependencies
        run: pip install -r projects/company-server/web-app/requirements.txt

      - name: Compile Python
        run: python -m py_compile projects/company-server/web-app/app.py

      - name: Create Build Report
        run: |
          echo "Python validation completed successfully." > build-report.txt
          echo "Workflow: $GITHUB_WORKFLOW" >> build-report.txt
          echo "Repository: $GITHUB_REPOSITORY" >> build-report.txt
          echo "Branch: $GITHUB_REF" >> build-report.txt
          echo "Commit: $GITHUB_SHA" >> build-report.txt
          echo "Actor: $GITHUB_ACTOR" >> build-report.txt
          echo "Run Number: $GITHUB_RUN_NUMBER" >> build-report.txt
          echo "Runner OS: $RUNNER_OS" >> build-report.txt
          echo "Python Version: ${{ matrix.python-version }}" >> build-report.txt

      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          # Create a unique artifact for each matrix job
          name: build-report-python-${{ matrix.python-version }}
          path: build-report.txt

  # Build the Docker image after successful Python validation
  docker-build:
    name: Docker Image Build
    needs: python-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t company-server:${{ github.sha }} \
            -t company-server:latest \
            projects/company-server/web-app

      - name: List Docker Images
        run: docker image ls

  # Start the containerized application and verify its health
  docker-compose-test:
    name: Docker Compose Integration Test
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Compose File
        run: |
          docker compose \
            -f projects/company-server/web-app/compose.yaml \
            config

      - name: Start Application
        run: |
          docker compose \
            -f projects/company-server/web-app/compose.yaml \
            up --build -d
      
      - name: Wait for Application
        run: |
          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:8080/health; then
              echo
              echo "Application is healthy."
              exit 0
            fi

            echo "Application is not ready yet. Attempt $attempt/12."
            sleep 5
          done

          echo "Application did not become healthy in time."
          exit 1

      - name: Show Container Status
        if: always()
        run: |
          docker compose \
            -f projects/company-server/web-app/compose.yaml \
            ps

      - name: Show Container Logs
        if: always()
        run: |
          docker compose \
            -f projects/company-server/web-app/compose.yaml \
            logs

      - name: Stop Containers
        if: always()
        run: |
          docker compose \
            -f projects/company-server/web-app/compose.yaml \
            down --volumes --remove-orphans
  
  # Demonstrate secure access to GitHub repository secrets
  secret-demo:
    name: GitHub Secrets Demo
    runs-on: ubuntu-latest

    steps:
      - name: Display Secret Usage
        env: 
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_MESSAGE: ${{ secrets.DEMO_MESSAGE }}
        run: |
          echo "Successfully loaded repository secrets."
          echo "Username length: ${#DEMO_USERNAME}"
          echo "Message length: ${#DEMO_MESSAGE}"
